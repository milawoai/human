[project]
name = "python-service"
version = "0.1.0"
description = "Human Python Service (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "funasr>=1.0.0",
    "numpy>=1.21.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "qwen-asr>=0.0.6",
    "scipy>=1.7.0",
    "sherpa-onnx>=1.12.33",
    "sherpa-onnx-bin>=1.12.15",
    "sounddevice>=0.5.3",
    "soundfile>=0.12.0",
    "torch==2.9.*",
    "torchaudio==2.9.*",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
