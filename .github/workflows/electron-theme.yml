name: Electron theme contract
on:
  pull_request:
    paths: ['apps/body/**', 'designs/theme.tokens.json', 'scripts/theme/**', 'scripts/verify-theme-usage.cjs', '.github/workflows/electron-theme.yml']
  push:
    branches: [master]
    paths: ['apps/body/**', 'designs/theme.tokens.json', 'scripts/theme/**', 'scripts/verify-theme-usage.cjs', '.github/workflows/electron-theme.yml']
permissions:
  contents: read
jobs:
  theme-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checker dependencies only
        run: npm install --prefix "$RUNNER_TEMP/theme-check" --no-package-lock --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 postcss@8.5.16 color-name@1.1.4
      - name: Test and enforce theme contract
        env:
          NODE_PATH: ${{ runner.temp }}/theme-check/node_modules
          THEME_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/theme/usage.test.cjs
          node scripts/verify-theme-usage.cjs --base-ref "$THEME_BASE_REF"
